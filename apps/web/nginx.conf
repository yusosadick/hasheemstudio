server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA fallback — client-side router (react-router-dom) owns everything else.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets are immutable; index.html itself is not (must always revalidate so a new
  # deploy is picked up), so no cache headers are set for it above.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
