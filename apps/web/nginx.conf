server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

  location /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Unknown URLs are a real 404 (with a noindex page), not a 200 that search engines index as a duplicate.
  error_page 404 /404.html;
  location = /404.html { internal; add_header Cache-Control "no-cache"; }

  # Public, indexable pages (static HTML generated at build time by scripts/seo-prerender.mjs).
  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  location ~ ^/(privacy|terms)/?$ { add_header Cache-Control "no-cache"; try_files /$1/index.html =404; }

  # Private/app routes are served by the SPA but must never be indexed.
  location ~ ^/(login|signup|register|forgot-password|reset-password|verify-email|auth/callback|app/.*)$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /site.webmanifest { default_type application/manifest+json; add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

  # Brand images and icons: cacheable for a week.
  location ~ ^/(images/|favicon|apple-touch-icon|site\.webmanifest) {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # robots.txt, sitemap.xml and any other real file.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
